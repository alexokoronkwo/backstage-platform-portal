app:
  title: Scaffolded Backstage App
  baseUrl: http://localhost:3000
  packages: all

organization:
  name: My Company

backend:
  # Used for enabling authentication, secret token will be generated in dev environment if not set
  # https://backstage.io/docs/tutorials/backend-to-backend-auth
  # auth:
  #   keys:
  #     - secret: "${BACKEND_SECRET}"
  baseUrl: http://localhost:7007
  listen:
    port: 7007
    # The Host header is restricted to match the origin, and the advertised baseUrl
    # host: 127.0.0.1
  csp:
    connect-src: ["'self'", 'http:', 'https:']
    # Content-Security-Policy directives, if you need to override any defaults in the backend
  cors:
    origin: http://localhost:3000
    methods: [GET, POST, PUT, DELETE, PATCH, OPTIONS]
    credentials: true
  database:
    client: better-sqlite3
    connection: ':memory:'
  # workingDirectory: #{backend.workingDirectory}

integrations:
  github:
    - host: github.com
      token: ${GITHUB_TOKEN}

proxy:
  endpoints:
    '/circleci/api':
      target: https://circleci.com/api/v1.1
      allowedMethods: ['GET']

# Reference documentation https://backstage.io/docs/features/techdocs/configuration
# Note: See https://backstage.io/docs/features/techdocs/getting-started to setup local builder
techdocs:
  generator:
    runIn: local
  publisher:
    type: local
  builder: 'local'

auth:
  # see https://backstage.io/docs/auth/ to add auth providers
  environment: development
  providers:
    guest: {}

scaffolder:
  # see https://backstage.io/docs/features/software-templates/configuration for options

catalog:
  import:
    entityFilename: catalog-info.yaml
    pullRequestBranchName: backstage-integration
  rules:
    - allow: [Component, API, Resource, Location]
  locations:
    # Local Template for Python Microservice
    - type: file
      target: ../../templates/python-microservice-template/template.yaml
      rules:
        - allow: [Template]

    # Backstage Example Components & Templates
    - type: file
      target: ../../examples/entities.yaml
      rules:
        - allow: [Component, API, Resource, Location, System]

    - type: file
      target: ../../examples/template/template.yaml
      rules:
        - allow: [Template]

    - type: file
      target: ../../examples/org.yaml
      rules:
        - allow: [User, Group]

    - type: file
      target: ../../examples/platform.yaml
      rules:
        - allow: [Group, System]
